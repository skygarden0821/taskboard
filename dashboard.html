<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Dashboard — Xector1</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.10.0/dist/tabler-icons.min.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f11;--bg2:#17171a;--bg3:#1e1e22;--bg4:#26262c;--surface:#1c1c21;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);--border3:rgba(255,255,255,0.22);
  --text:#f0f0f2;--text2:#9090a0;--text3:#55555f;
  --accent:#c8ff00;--accent-dim:rgba(200,255,0,0.12);--accent-dim2:rgba(200,255,0,0.06);
  --blue:#4a9eff;--blue-dim:rgba(74,158,255,0.15);
  --green:#3ecf8e;--green-dim:rgba(62,207,142,0.15);
  --amber:#f5a623;--amber-dim:rgba(245,166,35,0.15);
  --coral:#ff6b6b;--coral-dim:rgba(255,107,107,0.15);
  --purple:#a78bfa;
  --r:8px;--rl:12px;--rxl:16px;
  --font:'DM Sans','Noto Sans JP',sans-serif;
}
body{font-family:var(--font);font-size:13px;color:var(--text);background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased}
.layout{display:flex;min-height:100vh}
.sidebar{width:220px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 0}
.sidebar-logo{padding:0 20px 24px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.logo-mark{width:30px;height:30px;background:var(--accent);border-radius:7px;display:flex;align-items:center;justify-content:center}
.logo-mark i{font-size:17px;color:#0f0f11}
.logo-text{font-size:15px;font-weight:600;letter-spacing:-.3px}
.logo-sub{font-size:10px;color:var(--text3);margin-top:1px}
.sidebar-section{padding:16px 20px 6px;font-size:10px;font-weight:600;letter-spacing:.08em;color:var(--text3);text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 20px;font-size:13px;cursor:pointer;color:var(--text2);transition:all .15s;position:relative;text-decoration:none}
.nav-item:hover{color:var(--text);background:var(--bg3)}
.nav-item.active{color:var(--accent);background:var(--accent-dim2)}
.nav-item.active::before{content:'';position:absolute;left:0;top:4px;bottom:4px;width:2px;background:var(--accent);border-radius:0 2px 2px 0}
.nav-item i{font-size:16px}
.main{flex:1;overflow:auto;min-width:0}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--border);background:var(--bg2)}
.topbar-title{font-size:15px;font-weight:600;flex:1}
.date-badge{font-size:12px;color:var(--text3);background:var(--bg3);padding:5px 12px;border-radius:var(--r);border:1px solid var(--border)}
.content{padding:24px;display:flex;flex-direction:column;gap:20px}

/* kpi cards */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:18px 20px;animation:fadeUp .3s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.kpi-label{font-size:11px;color:var(--text3);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.kpi-val{font-size:32px;font-weight:600;line-height:1;margin-bottom:4px}
.kpi-sub{font-size:11px;color:var(--text3)}
.kpi-bar{height:3px;background:var(--bg4);border-radius:2px;margin-top:12px}
.kpi-bar-fill{height:3px;border-radius:2px;transition:width .6s ease}

/* section */
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.section-title{font-size:13px;font-weight:600}
.section-link{font-size:11px;color:var(--text3);text-decoration:none;display:flex;align-items:center;gap:4px}
.section-link:hover{color:var(--text2)}

/* 2col */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}

/* group progress */
.group-progress{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:20px;animation:fadeUp .35s ease both}
.gp-item{margin-bottom:16px}
.gp-item:last-child{margin-bottom:0}
.gp-head{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.gp-dot{width:8px;height:8px;border-radius:50%}
.gp-name{font-size:12px;font-weight:500;flex:1}
.gp-pct{font-size:12px;font-weight:600}
.gp-track{height:6px;background:var(--bg4);border-radius:3px}
.gp-fill{height:6px;border-radius:3px;transition:width .6s ease}
.gp-meta{display:flex;gap:10px;margin-top:5px}
.gp-meta-item{font-size:10px;color:var(--text3);display:flex;align-items:center;gap:3px}

/* donut */
.donut-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:20px;display:flex;flex-direction:column;animation:fadeUp .4s ease both}
.donut-wrap{display:flex;align-items:center;gap:20px;margin-top:8px}
.donut-svg{flex-shrink:0}
.donut-legend{display:flex;flex-direction:column;gap:10px;flex:1}
.legend-item{display:flex;align-items:center;gap:8px}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.legend-label{font-size:11px;color:var(--text2);flex:1}
.legend-val{font-size:12px;font-weight:600}

/* overdue / upcoming */
.list-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:20px;animation:fadeUp .45s ease both}
.list-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.list-item:last-child{border-bottom:none;padding-bottom:0}
.list-item:first-child{padding-top:0}
.list-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.list-name{font-size:12px;flex:1;line-height:1.4}
.list-group{font-size:10px;color:var(--text3)}
.list-badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap}
.badge-overdue{color:var(--coral);background:var(--coral-dim)}
.badge-soon{color:var(--amber);background:var(--amber-dim)}
.badge-ok{color:var(--green);background:var(--green-dim)}
.empty-state{text-align:center;padding:16px;color:var(--text3);font-size:11px}
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-mark"><i class="ti ti-layout-kanban"></i></div>
    <div><div class="logo-text">TaskBoard</div><div class="logo-sub">Xector1合同会社</div></div>
  </div>
  <div class="sidebar-section">ビュー</div>
  <a class="nav-item" href="index.html"><i class="ti ti-layout-columns"></i>カンバン</a>
  <a class="nav-item" href="index.html"><i class="ti ti-timeline"></i>タイムライン</a>
  <a class="nav-item active" href="dashboard.html"><i class="ti ti-chart-bar"></i>ダッシュボード</a>
</aside>
<div class="main">
  <div class="topbar">
    <div class="topbar-title">ダッシュボード</div>
    <div class="date-badge" id="dateBadge"></div>
  </div>
  <div class="content" id="content">
    <div style="color:var(--text3);font-size:12px;padding:40px;text-align:center">読み込み中...</div>
  </div>
</div>
</div>
<script>
const STORAGE='taskboard_v3';
const TODAY=new Date();TODAY.setHours(0,0,0,0);
const parseD=s=>{const[y,m,d]=s.split('-');return new Date(+y,+m-1,+d)};

document.getElementById('dateBadge').textContent=`${TODAY.getFullYear()}年${TODAY.getMonth()+1}月${TODAY.getDate()}日`;

function loadData(){
  try{const d=localStorage.getItem(STORAGE);if(d)return JSON.parse(d);}catch(e){}
  return{
    groups:[
      {id:'g1',name:'Xector1 採用・オーディション'},
      {id:'g2',name:'メンバーポータル'},
      {id:'g3',name:'Instagram施策'},
      {id:'g4',name:'MIX・マスタリング事業'},
    ],
    tasks:[
      {id:'t1',gid:'g1',name:'X投稿30本シリーズ作成',status:'doing',start:'2025-04-30',end:'2025-05-14',pct:45},
      {id:'t2',gid:'g1',name:'メンバー体験談ポスト制作',status:'doing',start:'2025-05-03',end:'2025-05-11',pct:60},
      {id:'t3',gid:'g1',name:'オーディション告知DM送付',status:'todo',start:'2025-05-12',end:'2025-05-22',pct:0},
      {id:'t4',gid:'g1',name:'審査フォーム整備',status:'review',start:'2025-05-03',end:'2025-05-10',pct:80},
      {id:'t5',gid:'g1',name:'月間430DM送付達成',status:'todo',start:'2025-05-07',end:'2025-06-06',pct:0},
      {id:'t6',gid:'g2',name:'ホーム画面週次メッセージ更新',status:'doing',start:'2025-05-04',end:'2025-05-09',pct:70},
      {id:'t7',gid:'g2',name:'Tipsシステム追加コンテンツ',status:'todo',start:'2025-05-11',end:'2025-05-20',pct:0},
      {id:'t8',gid:'g2',name:'コミュニティフィード投稿スケジュール',status:'review',start:'2025-05-01',end:'2025-05-08',pct:85},
      {id:'t9',gid:'g3',name:'Instagram DM戦略立案',status:'todo',start:'2025-05-09',end:'2025-05-16',pct:0},
      {id:'t10',gid:'g3',name:'アカウント最適化',status:'todo',start:'2025-05-13',end:'2025-05-26',pct:0},
      {id:'t11',gid:'g4',name:'サービスページ公開',status:'done',start:'2025-04-22',end:'2025-04-29',pct:100},
      {id:'t12',gid:'g4',name:'料金プラン見直し',status:'todo',start:'2025-05-11',end:'2025-05-18',pct:0},
      {id:'t13',gid:'g4',name:'特商法ページ整備',status:'done',start:'2025-04-26',end:'2025-05-01',pct:100},
    ]
  };
}

const GCOLS=['#c8ff00','#4a9eff','#3ecf8e','#f5a623','#ff6b6b','#a78bfa'];
const gidx=(groups,gid)=>groups.findIndex(g=>g.id===gid);
const gcol=(groups,gid)=>GCOLS[gidx(groups,gid)%GCOLS.length];

function buildDonut(counts,colors,size=120,stroke=18){
  const total=Object.values(counts).reduce((a,b)=>a+b,0)||1;
  let offset=0;
  const r=(size-stroke)/2,cx=size/2,cy=size/2,circ=2*Math.PI*r;
  const paths=Object.entries(counts).map(([key,val],i)=>{
    const pct=val/total;
    const dash=circ*pct,gap=circ-dash;
    const path=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${colors[i]}" stroke-width="${stroke}" stroke-dasharray="${dash} ${gap}" stroke-dashoffset="${-offset*circ}" stroke-linecap="butt" transform="rotate(-90 ${cx} ${cy})"/>`;
    offset+=pct;
    return path;
  });
  return`<svg width="${size}" height="${size}" class="donut-svg">${paths.join('')}</svg>`;
}

function render(){
  const{groups,tasks}=loadData();
  const total=tasks.length;
  const done=tasks.filter(t=>t.status==='done').length;
  const doing=tasks.filter(t=>t.status==='doing').length;
  const review=tasks.filter(t=>t.status==='review').length;
  const todo=tasks.filter(t=>t.status==='todo').length;
  const overallPct=total?Math.round(done/total*100):0;
  const avgPct=total?Math.round(tasks.reduce((a,t)=>a+t.pct,0)/total):0;
  const overdue=tasks.filter(t=>parseD(t.end)<TODAY&&t.status!=='done');
  const upcoming=tasks.filter(t=>{
    const d=parseD(t.end);
    const diff=Math.round((d-TODAY)/86400000);
    return diff>=0&&diff<=7&&t.status!=='done';
  }).sort((a,b)=>parseD(a.end)-parseD(b.end));

  const donutColors=['#3ecf8e','#4a9eff','#f5a623','#55555f'];
  const donutCounts={done,doing,review,todo};

  const groupRows=groups.map((g,gi)=>{
    const gt=tasks.filter(t=>t.gid===g.id);
    if(!gt.length)return'';
    const gc=GCOLS[gi%GCOLS.length];
    const gDone=gt.filter(t=>t.status==='done').length;
    const gDoing=gt.filter(t=>t.status==='doing').length;
    const gTodo=gt.filter(t=>t.status==='todo').length;
    const gPct=Math.round(gt.reduce((a,t)=>a+t.pct,0)/gt.length);
    return`<div class="gp-item">
      <div class="gp-head"><div class="gp-dot" style="background:${gc}"></div><div class="gp-name">${g.name}</div><div class="gp-pct" style="color:${gc}">${gPct}%</div></div>
      <div class="gp-track"><div class="gp-fill" style="width:${gPct}%;background:${gc}"></div></div>
      <div class="gp-meta">
        <div class="gp-meta-item"><i class="ti ti-check" style="font-size:10px;color:#3ecf8e"></i>完了 ${gDone}</div>
        <div class="gp-meta-item"><i class="ti ti-progress" style="font-size:10px;color:#4a9eff"></i>進行中 ${gDoing}</div>
        <div class="gp-meta-item"><i class="ti ti-circle" style="font-size:10px"></i>未着手 ${gTodo}</div>
      </div>
    </div>`;
  }).join('');

  const overdueRows=overdue.length===0
    ?'<div class="empty-state"><i class="ti ti-circle-check" style="font-size:18px;display:block;margin-bottom:5px;color:var(--green)"></i>遅延タスクなし</div>'
    :overdue.map(t=>{
      const g=groups.find(g=>g.id===t.gid);
      const days=Math.abs(Math.round((parseD(t.end)-TODAY)/86400000));
      return`<div class="list-item"><div class="list-dot" style="background:var(--coral)"></div><div><div class="list-name">${t.name}</div><div class="list-group">${g?.name||''}</div></div><div class="list-badge badge-overdue">${days}日超過</div></div>`;
    }).join('');

  const upcomingRows=upcoming.length===0
    ?'<div class="empty-state">直近の締切なし</div>'
    :upcoming.map(t=>{
      const g=groups.find(g=>g.id===t.gid);
      const days=Math.round((parseD(t.end)-TODAY)/86400000);
      const cls=days===0?'badge-overdue':days<=3?'badge-soon':'badge-ok';
      const lbl=days===0?'今日':days===1?'明日':`${days}日後`;
      return`<div class="list-item"><div class="list-dot" style="background:var(--amber)"></div><div><div class="list-name">${t.name}</div><div class="list-group">${g?.name||''}</div></div><div class="list-badge ${cls}">${lbl}</div></div>`;
    }).join('');

  document.getElementById('content').innerHTML=`
    <div class="kpi-row">
      <div class="kpi" style="animation-delay:0s">
        <div class="kpi-label"><i class="ti ti-list-check" style="font-size:14px"></i>総タスク数</div>
        <div class="kpi-val">${total}</div>
        <div class="kpi-sub">全グループ合計</div>
        <div class="kpi-bar"><div class="kpi-bar-fill" style="width:100%;background:var(--text3)"></div></div>
      </div>
      <div class="kpi" style="animation-delay:.05s">
        <div class="kpi-label"><i class="ti ti-circle-check" style="font-size:14px;color:var(--green)"></i>完了率</div>
        <div class="kpi-val" style="color:var(--accent)">${overallPct}%</div>
        <div class="kpi-sub">${done} / ${total} タスク完了</div>
        <div class="kpi-bar"><div class="kpi-bar-fill" style="width:${overallPct}%;background:var(--accent)"></div></div>
      </div>
      <div class="kpi" style="animation-delay:.1s">
        <div class="kpi-label"><i class="ti ti-progress" style="font-size:14px;color:var(--blue)"></i>平均進捗</div>
        <div class="kpi-val" style="color:var(--blue)">${avgPct}%</div>
        <div class="kpi-sub">全タスク平均</div>
        <div class="kpi-bar"><div class="kpi-bar-fill" style="width:${avgPct}%;background:var(--blue)"></div></div>
      </div>
      <div class="kpi" style="animation-delay:.15s">
        <div class="kpi-label"><i class="ti ti-alert-triangle" style="font-size:14px;color:var(--coral)"></i>遅延タスク</div>
        <div class="kpi-val" style="color:${overdue.length>0?'var(--coral)':'var(--green)'}">${overdue.length}</div>
        <div class="kpi-sub">${overdue.length>0?'要対応あり':'問題なし'}</div>
        <div class="kpi-bar"><div class="kpi-bar-fill" style="width:${Math.min(overdue.length/total*100,100)}%;background:var(--coral)"></div></div>
      </div>
    </div>

    <div class="two-col">
      <div class="group-progress">
        <div class="section-head"><div class="section-title">グループ別進捗</div></div>
        ${groupRows}
      </div>
      <div class="donut-card">
        <div class="section-head"><div class="section-title">ステータス分布</div></div>
        <div class="donut-wrap">
          ${buildDonut(donutCounts,donutColors)}
          <div class="donut-legend">
            <div class="legend-item"><div class="legend-dot" style="background:#3ecf8e"></div><div class="legend-label">完了</div><div class="legend-val">${done}</div></div>
            <div class="legend-item"><div class="legend-dot" style="background:#4a9eff"></div><div class="legend-label">進行中</div><div class="legend-val">${doing}</div></div>
            <div class="legend-item"><div class="legend-dot" style="background:#f5a623"></div><div class="legend-label">レビュー</div><div class="legend-val">${review}</div></div>
            <div class="legend-item"><div class="legend-dot" style="background:#55555f"></div><div class="legend-label">未着手</div><div class="legend-val">${todo}</div></div>
          </div>
        </div>
      </div>
    </div>

    <div class="two-col">
      <div class="list-card">
        <div class="section-head"><div class="section-title"><i class="ti ti-alert-circle" style="color:var(--coral);margin-right:5px"></i>遅延タスク</div></div>
        ${overdueRows}
      </div>
      <div class="list-card">
        <div class="section-head"><div class="section-title"><i class="ti ti-clock" style="color:var(--amber);margin-right:5px"></i>直近7日の締切</div></div>
        ${upcomingRows}
      </div>
    </div>
  `;
}

render();
</script>
</body>
</html>
